name: Creative Studio checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  creative:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run creative:check
      - run: npm run creative:render-check
      - run: npm run creative:design-tokens
      - run: npm run creative:verify-suggestions
      - run: npm run creative:verify-image-processing
      - run: npm run creative:verify-video-upload
      - run: npm run creative:verify-voiceover
      - run: npm run creative:verify-storyboard
      - run: npm run creative:verify-operations
      - run: npm run creative:verify-package
      - run: npm run creative:load-test -- 12
      - run: npm run build
